<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fútbol | Mis Canales</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #0f0f13; color: white; }
        header { background: linear-gradient(90deg, #00b894, #00cec9); padding: 30px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.1rem; }
        main { padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .video-card { background: #1a1a24; padding: 20px; margin-bottom: 20px; border-radius: 10px; border-left: 5px solid #00b894; }
        .video-card a { color: white; text-decoration: none; font-weight: 500; }
        .video-card a:hover { color: #00cec9; }
        .date { font-size: 0.85rem; color: #aaa; margin-top: 8px; display: block; }
    </style>
</head>
<body>
    <header>
        <h1>⚽ Canal de Fútbol</h1>
        <nav><a href="index.html">🏠 Inicio</a></nav>
    </header>
    <main>
        <h2>Últimos Videos</h2>
        <ul id="feed-futbol-full"></ul>
    </main>
    <script>
        // ⚠️ CAMBIA ESTE ID POR EL DE @VinotintoGalactico
        const CHANNEL_ID = 'UCxxxxxxxxxxxxxxxxxxxxxxx';
        async function load() {
            const url = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            try {
                const res = await fetch(api);
                const data = await res.json();
                const list = document.getElementById('feed-futbol-full');
                if (data.status === 'ok') {
                    data.items.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'video-card';
                        li.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a><span class="date">${new Date(item.pubDate).toLocaleDateString('es-VE')}</span>`;
                        list.appendChild(li);
                    });
                }
            } catch(e) { console.error(e); }
        }
        load();
    </script>
</body>
</html>
