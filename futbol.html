<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fútbol | Mis Canales</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #0f0f13; color: white; }
        header { background: #00b894; padding: 30px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.1rem; }
        main { padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        .video-placeholder { background: #1a1a24; padding: 20px; margin-bottom: 20px; border-radius: 10px; border-left: 5px solid #00b894; }
    </style>
</head>
<body>
    <header>
        <h1> Canal de Fútbol</h1>
        <nav>
            <a href="index.html"> Inicio</a>
        </nav>
    </header>
    <main>
        <h2>Últimos Videos</h2>
        <ul class="video-list" id="feed-futbol-full"></ul>
    </main>
    <script>
        const CHANNEL_ID = 'UCxxxxxxxxxxxxxx'; // CAMBIA ESTO POR TU ID DE FÚTBOL
        async function load() {
            const url = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            const res = await fetch(api);
            const data = await res.json();
            const list = document.getElementById('feed-futbol-full');
            data.items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'video-placeholder';
                li.innerHTML = `<h3><a href="${item.link}" style="color:white">${item.title}</a></h3><p>${new Date(item.pubDate).toLocaleDateString()}</p>`;
                list.appendChild(li);
            });
        }
        load();
    </script>
</body>
</html>
